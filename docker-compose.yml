services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kiriox
      POSTGRES_PASSWORD: kiriox
      POSTGRES_DB: kiriox
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - kiriox-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kiriox -d kiriox"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  kiriox-postgres:
